name: Vercel Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Code lint
        run: npm run lint:code

      - name: Unit tests
        run: npm run test

      - name: Build web
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-key-for-ci
          VITE_ALLOW_LOCAL_DEMO: 'true'

      - name: Accessibility E2E
        run: npm run test:a11y
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-key-for-ci
          VITE_ALLOW_LOCAL_DEMO: 'true'
          PLAYWRIGHT_USE_WEBSERVER: 'true'

      - name: Bundle budget
        run: npm run check:bundle

      - name: Security audit
        run: npm audit --omit=dev

      - name: Check RLS validator secrets
        id: rls_secrets
        shell: bash
        run: |
          if [[ -n "$VITE_SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RLS validator secrets are not configured; skipping tenant and role checks."
          fi

      - name: Multi-tenant isolation (RLS)
        if: steps.rls_secrets.outputs.available == 'true'
        run: npm run test:multitenant

      - name: Production roles (RLS)
        if: steps.rls_secrets.outputs.available == 'true'
        run: npm run test:roles
