<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">Del registro al seguimiento de un expediente</title>
  <desc id="desc">Cinco momentos del trabajo de convivencia escolar: registrar, organizar, dar seguimiento, documentar y consultar resultados. La decisión institucional permanece a cargo del equipo responsable.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e1b33"/><stop offset="1" stop-color="#1d3557"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#081526" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1400" height="570" rx="28" fill="#eef3f8"/>
  <path d="M0 28Q0 0 28 0h1344q28 0 28 28v212H0Z" fill="url(#bg)"/>
  <rect x="54" y="43" width="164" height="32" rx="16" fill="#ff791a"/>
  <text x="136" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.4">CÓMO FUNCIONA</text>
  <text x="54" y="124" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#ffffff">Un proceso visible de principio a fin</text>
  <text x="54" y="165" font-family="Arial, sans-serif" font-size="21" fill="#c9d6e7">Antecedentes, actuaciones y documentos reunidos para el trabajo del equipo.</text>
  <path d="M52 341h1296" stroke="#b9c8d8" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(53 222)"><rect width="246" height="240" rx="22" fill="#ffffff"/><rect width="246" height="7" rx="3" fill="#ff791a"/><circle cx="38" cy="45" r="19" fill="#fff0e5"/><text x="38" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#d35300">1</text><text x="23" y="101" font-size="24" font-weight="700" fill="#14243d">Registrar</text><text x="23" y="134" font-size="18" fill="#52647c">Ingresar anotaciones</text><text x="23" y="160" font-size="18" fill="#52647c">y antecedentes.</text><rect x="22" y="198" width="87" height="22" rx="11" fill="#fff0e5"/><text x="65" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#ad4700">INICIO</text></g>
    <g transform="translate(315 222)"><rect width="246" height="240" rx="22" fill="#ffffff"/><rect width="246" height="7" rx="3" fill="#ff9b43"/><circle cx="38" cy="45" r="19" fill="#fff0e5"/><text x="38" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#d35300">2</text><text x="23" y="101" font-size="24" font-weight="700" fill="#14243d">Organizar</text><text x="23" y="134" font-size="18" fill="#52647c">Abrir el expediente</text><text x="23" y="160" font-size="18" fill="#52647c">y situar su etapa.</text><rect x="22" y="198" width="124" height="22" rx="11" fill="#eef3f8"/><text x="84" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#36526e">EXPEDIENTE</text></g>
    <g transform="translate(577 222)"><rect width="246" height="240" rx="22" fill="#ffffff"/><rect width="246" height="7" rx="3" fill="#86a1bb"/><circle cx="38" cy="45" r="19" fill="#eaf1f7"/><text x="38" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#36526e">3</text><text x="23" y="101" font-size="24" font-weight="700" fill="#14243d">Seguir</text><text x="23" y="134" font-size="18" fill="#52647c">Revisar actuaciones,</text><text x="23" y="160" font-size="18" fill="#52647c">responsables y plazos.</text><rect x="22" y="198" width="100" height="22" rx="11" fill="#eef3f8"/><text x="72" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#36526e">BITÁCORA</text></g>
    <g transform="translate(839 222)"><rect width="246" height="240" rx="22" fill="#ffffff"/><rect width="246" height="7" rx="3" fill="#86a1bb"/><circle cx="38" cy="45" r="19" fill="#eaf1f7"/><text x="38" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#36526e">4</text><text x="23" y="101" font-size="24" font-weight="700" fill="#14243d">Documentar</text><text x="23" y="134" font-size="18" fill="#52647c">Preparar cartas e</text><text x="23" y="160" font-size="18" fill="#52647c">informes del caso.</text><rect x="22" y="198" width="123" height="22" rx="11" fill="#eef3f8"/><text x="83" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#36526e">DOCUMENTOS</text></g>
    <g transform="translate(1101 222)"><rect width="246" height="240" rx="22" fill="#ffffff"/><rect width="246" height="7" rx="3" fill="#27b277"/><circle cx="38" cy="45" r="19" fill="#e7f8f0"/><text x="38" y="52" text-anchor="middle" font-size="21" font-weight="700" fill="#168655">5</text><text x="23" y="101" font-size="24" font-weight="700" fill="#14243d">Consultar</text><text x="23" y="134" font-size="18" fill="#52647c">Ver indicadores y</text><text x="23" y="160" font-size="18" fill="#52647c">exportar reportes.</text><rect x="22" y="198" width="93" height="22" rx="11" fill="#e7f8f0"/><text x="68" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#168655">GESTIÓN</text></g>
  </g>
  <text x="54" y="518" font-family="Arial, sans-serif" font-size="18" fill="#52647c">Cada decisión y medida corresponde al establecimiento y a su equipo responsable.</text>
</svg>
