<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Funciones de Gestión de Casos</title>
  <desc id="desc">Seis áreas: expedientes, anotaciones, documentos, reportes, administración y privacidad.</desc>
  <rect width="1400" height="720" rx="28" fill="#f1f5f9"/>
  <rect x="0" y="0" width="1400" height="191" rx="28" fill="#101d35"/>
  <path d="M0 161h1400v30H0Z" fill="#101d35"/>
  <rect x="54" y="39" width="175" height="32" rx="16" fill="#ff791a"/>
  <text x="141" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1.2">LA PLATAFORMA</text>
  <text x="54" y="121" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#ffffff">Todo el trabajo, mejor conectado</text>
  <text x="54" y="156" font-family="Arial, sans-serif" font-size="21" fill="#c9d6e7">Seis áreas para registrar, consultar y acompañar la gestión escolar.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(54 217)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#ff791a"/><circle cx="54" cy="51" r="25" fill="#fff0e5"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#d35300">01</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Expedientes</text><text x="29" y="110" font-size="19" fill="#52647c">Etapas, actuaciones y bitácora</text><text x="29" y="140" font-size="19" fill="#52647c">para seguir cada caso.</text></g>
    <g transform="translate(494 217)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#ff9b43"/><circle cx="54" cy="51" r="25" fill="#fff0e5"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#d35300">02</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Anotaciones</text><text x="29" y="110" font-size="19" fill="#52647c">Historial, clasificación y estado</text><text x="29" y="140" font-size="19" fill="#52647c">de las cartas asociadas.</text></g>
    <g transform="translate(934 217)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#7698ba"/><circle cx="54" cy="51" r="25" fill="#eaf1f7"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#36526e">03</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Documentos</text><text x="29" y="110" font-size="19" fill="#52647c">Cartas e informes preparados</text><text x="29" y="140" font-size="19" fill="#52647c">para revisión institucional.</text></g>
    <g transform="translate(54 440)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#7698ba"/><circle cx="54" cy="51" r="25" fill="#eaf1f7"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#36526e">04</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Reportes</text><text x="29" y="110" font-size="19" fill="#52647c">Filtros e indicadores con opción</text><text x="29" y="140" font-size="19" fill="#52647c">de exportar a Excel.</text></g>
    <g transform="translate(494 440)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#7698ba"/><circle cx="54" cy="51" r="25" fill="#eaf1f7"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#36526e">05</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Administración</text><text x="29" y="110" font-size="19" fill="#52647c">Usuarios, roles, cursos y</text><text x="29" y="140" font-size="19" fill="#52647c">configuración del colegio.</text></g>
    <g transform="translate(934 440)"><rect width="412" height="195" rx="22" fill="#ffffff" stroke="#dce5ee"/><rect width="7" height="195" rx="3" fill="#27b277"/><circle cx="54" cy="51" r="25" fill="#e7f8f0"/><text x="54" y="59" text-anchor="middle" font-size="25" font-weight="700" fill="#168655">06</text><text x="96" y="60" font-size="25" font-weight="700" fill="#14243d">Privacidad</text><text x="29" y="110" font-size="19" fill="#52647c">Modo para ocultar identificadores</text><text x="29" y="140" font-size="19" fill="#52647c">personales en pantalla.</text></g>
  </g>
  <text x="54" y="687" font-family="Arial, sans-serif" font-size="18" fill="#52647c">Gestión de Casos · Convivencia escolar</text>
